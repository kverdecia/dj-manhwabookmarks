[project]
name = "dj-manhwabookmarks"
description = "Add your description here"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "django-allauth[openid,socialaccount]>=65.2.0",
    "django-htmx>=1.21.0",
    "django>=5.1.3",
    "mechanicalsoup>=1.3.0",
    "playwright>=1.48.0",
    "requests>=2.32.3",
]
dynamic = ["version"]

[project.optional-dependencies]
pg = [
    "psycopg[binary]>=3.2.4",
]
linting = [
    "ruff>=0.9.5",
]
typing = [
    "django-stubs-ext>=5.1.3",
    "django-stubs[compatible-mypy]>=5.1.3",
    "invoke>=2.2.0",
    "lxml-stubs>=0.5.1",
    "mypy>=1.15.0",
    "psycopg[binary]>=3.2.4",
    "pydantic>=2.10.6",
    "types-requests>=2.32.0.20241016",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "coverage>=7.6.10",
    "django-stubs-ext>=5.1.3",
    "django-stubs[compatible-mypy]>=5.1.3",
    "flake8>=7.1.1",
    "invoke>=2.2.0",
    "mock>=5.1.0",
    "mypy>=1.15.0",
    "nox>=2024.10.9",
    "pre-commit>=4.1.0",
    "ruff>=0.9.5",
    "twine>=6.1.0",
    "zest-releaser>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["djmanhwabookmarks"]
[tool.hatch.version]
path = "djmanhwabookmarks/__init__.py"

[tool.ruff.lint]
select = ["F", "E", "I", "S", "B", "SIM", "RUF"]
ignore = ["I001", "E501", "RUF012"]

[tool.mypy]
disable_error_code = ["var-annotated"]
plugins = [
    "pydantic.mypy",
    "mypy_django_plugin.main",
]

[tool.django-stubs]
django_settings_module = "tests.settings"
