[project]
name = "dj-manhwabookmarks"
description = "Add your description here"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "django-allauth[openid,socialaccount]>=65.2.0",
    "django-htmx>=1.21.0",
    "django>=5.1.3",
    "mechanicalsoup>=1.3.0",
    "playwright>=1.48.0",
]
dynamic = ["version"]

[project.optional-dependencies]
pg = [
    "psycopg[binary]>=3.2.4",
]

[tool.mypy]
plugins = [
    "pydantic.mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "coverage>=7.6.10",
    "django-stubs-ext>=5.1.3",
    "django-stubs[compatible-mypy]>=5.1.3",
    "flake8>=7.1.1",
    "invoke>=2.2.0",
    "mock>=5.1.0",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "tox>=4.24.1",
    "twine>=6.1.0",
    "zest-releaser>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["djmanhwabookmarks"]
[tool.hatch.version]
path = "djmanhwabookmarks/__init__.py"
